<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#07110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>手搓CPE · 5G CPE 管理</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=4" />
  </head>
  <body>
    <div class="wall" id="wall"></div>
    <div id="app" class="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <h3 id="sheet-title"></h3>
        <div id="sheet-body"></div>
        <div class="sheet-actions" id="sheet-actions"></div>
      </div>
    </div>
    <!-- 经典脚本：file:// 下 ES module 会被 CORS 拦掉，APK 内置页面必须这样加载 -->
    <input type="file" id="wall-file" accept="image/*" hidden />
    <script defer src="./app.js?v=4"></script>
  </body>
</html>
